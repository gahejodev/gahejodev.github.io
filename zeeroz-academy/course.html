<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10234b">
<title>Course Details | Zeeroz Academy</title>
<style>
:root{--navy:#10234b;--blue:#3565df;--teal:#16a6a1;--ink:#202b43;--muted:#65738c;--paper:#f3f6fc;--line:#e3e9f4}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.7}
.top{background:linear-gradient(115deg,#101b3d,#244d9a 72%,#117f91);color:#fff;padding:18px max(4%,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{font-weight:900;letter-spacing:.7px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#bde9f1}
.btn{display:inline-flex;align-items:center;background:#fff;color:var(--navy);padding:10px 15px;border-radius:11px;font-weight:800;text-decoration:none;font-size:13px}
.wrap{width:min(1000px,92%);margin:32px auto 70px}
.hero{position:relative;overflow:hidden;background:linear-gradient(125deg,#172a58,#315dc0 70%,#0f8b91);border-radius:25px;padding:clamp(25px,5vw,48px);color:#fff;box-shadow:0 18px 44px #183b7a20}
.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #ffffff25;border-radius:50%;right:-70px;top:-110px;box-shadow:0 0 0 28px #ffffff09,0 0 0 58px #ffffff07}
.eyebrow{display:inline-flex;background:#ffffff20;border:1px solid #ffffff40;border-radius:30px;padding:6px 11px;font-size:11px;letter-spacing:1.4px;font-weight:850}
h1{font-size:clamp(29px,5vw,44px);line-height:1.15;letter-spacing:-1px;margin:17px 0 10px;max-width:760px;color:#fff}
#courseDescription{max-width:760px;color:#e1eaff;margin:0;font-size:16px}
.section-title{font-size:23px;color:var(--navy);margin:30px 0 15px}.learning-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.language-control{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:800}.language-control select{border:1px solid #d8e2f2;border-radius:10px;padding:10px 12px;background:#fff;color:var(--navy);font:inherit;font-weight:800}
.course-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 28px}
.course-stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 18px;box-shadow:0 6px 18px #10234b08}
.course-stat span{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;font-weight:850}
.course-stat strong{display:block;color:var(--navy);font-size:21px;margin-top:3px}
.chapter{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);margin:20px 0;box-shadow:0 10px 30px #10234b09}
.chapter-top{border-bottom:1px solid var(--line);padding-bottom:17px}
.chapter-number{display:inline-flex;background:#eaf0ff;color:#3157d5;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:1.1px}
.chapter-count{float:right;color:var(--muted);font-size:12px;font-weight:700;padding-top:5px}
.chapter-title{font-size:clamp(22px,3.5vw,29px);line-height:1.25;color:var(--navy);margin:12px 0 0}
.chapter-description{color:var(--muted);margin:13px 0 18px}
.lesson{margin:18px 0 22px;padding:clamp(16px,3vw,24px);background:#fbfcff;border:1px solid #e8edf6;border-radius:17px}
.lesson-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px}
.lesson-index{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#e6efff,#e2fbf7);color:#2855b9;font-weight:900}
.lesson-label{font-size:9px;letter-spacing:1.5px;font-weight:900;color:var(--teal)}
.lesson-title{margin:2px 0 0;color:var(--navy);font-size:19px;line-height:1.35}
.lesson-content{color:#34415a;font-size:15px;line-height:1.85;overflow-wrap:anywhere}
.lesson-content p{margin:11px 0}
.lesson-heading{color:#18346f;line-height:1.3;margin:22px 0 8px}
h3.lesson-heading{font-size:18px}h4.lesson-heading{font-size:16px}
.lesson-list{padding-left:24px;margin:10px 0 17px}
.lesson-list li{padding:4px 0 4px 3px}
.lesson-list li::marker{color:#3565df;font-weight:900}
.lesson-callout{border-left:4px solid var(--teal);background:#eaf9f7;padding:13px 16px;border-radius:0 12px 12px 0;margin:15px 0;color:#215b5b}
.lesson-rule{border:0;border-top:1px solid var(--line);margin:18px 0}
.inline-code{background:#edf1fa;border-radius:5px;padding:2px 5px;font-size:.9em}
.lesson-figure{margin:18px auto 20px;padding:12px;background:#fff;border:1px solid #e2e9f5;border-radius:15px;text-align:center;max-width:700px}
.lesson-image{display:block;max-width:100%;max-height:440px;width:auto;height:auto;margin:auto;object-fit:contain}
.lesson-figure figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.lesson-table{width:100%;border-collapse:collapse;margin:15px 0;font-size:14px;background:#fff;border-radius:10px;overflow:hidden}
.lesson-table th{background:#eaf0ff;color:#203d7a;text-align:left}
.lesson-table th,.lesson-table td{border:1px solid #e1e8f3;padding:10px;vertical-align:top}
.written-practice{margin:24px 0;padding:20px;background:#f2f6ff;border:1px solid #dce6fa;border-radius:16px}.written-question{background:#fff;border:1px solid #e2e9f5;border-radius:12px;padding:15px;margin:12px 0}.written-question h4{color:#203d7a}.answer-details{margin-top:12px;border-top:1px solid #e6ebf4;padding-top:10px}.answer-details summary{cursor:pointer;color:#315bd0;font-weight:800}.answer-details .lesson-content{padding:10px 0}.quiz-button,.resource-link{display:inline-flex;margin-top:10px;background:linear-gradient(110deg,#315bd0,#168f9b);color:#fff;padding:12px 17px;border-radius:11px;text-decoration:none;font-weight:850;font-size:13px}
.empty{background:#fff;border:1px solid var(--line);padding:25px;border-radius:16px;color:var(--muted)}
@media(max-width:600px){.top{padding:15px 4%}.brand{font-size:13px}.btn{padding:9px 11px}.wrap{margin-top:20px}.course-stats{gap:8px}.course-stat{padding:12px 10px}.course-stat strong{font-size:18px}.course-stat span{font-size:9px}.chapter-count{float:none;display:block;margin-top:7px}.lesson-content{font-size:14px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="./student-dashboard.html" style="color:white;text-decoration:none">ZEEROZ ACADEMY<small>LEARN • GROW • SUCCEED</small></a><a class="btn" href="./student-dashboard.html">My Learning</a></header>
<main class="wrap">
<section class="hero"><span class="eyebrow">YOUR DIGITAL CLASSROOM</span><h1 id="courseTitle">Loading your course…</h1><p id="courseDescription">Please wait while your learning space loads.</p></section>
<div class="learning-toolbar"><h2 class="section-title">Your learning journey</h2><label class="language-control" for="courseLanguage">Lesson language <select id="courseLanguage" aria-label="Choose lesson language"><option value="en">English</option><option value="ur">اردو</option><option value="sd">سنڌي</option></select></label></div>
<section id="learningContent" class="empty">Preparing your lessons…</section>
</main>
<script type="module" src="./firebase-init.js"></script><script type="module" src="./course.js"></script>
</body></html>
