<title id="title">How an Enzyme Works</title><desc id="desc">Simplified sequence of enzyme action: substrate binds at the active site, is converted, and products leave.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7184a6"/></marker></defs><rect width="100%" height="100%" fill="#fbfcff"/><text x="500" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#14243c">How an Enzyme Works</text><text x="500" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#53657e">Substrate binding, reaction and product release</text><rect x="45" y="150" width="260" height="62" rx="15" fill="#e8f0ff" stroke="#536b93" stroke-width="2"/><text x="175" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17243b"><tspan x="175" dy="0">Enzyme + substrate</tspan></text><path d="M 175 212 C 175 237, 490 125, 490 150" fill="none" stroke="#7184a6" stroke-width="3" marker-end="url(#arr)"/><rect x="360" y="150" width="260" height="62" rx="15" fill="#e7f7f0" stroke="#536b93" stroke-width="2"/><text x="490" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17243b"><tspan x="490" dy="0">Specific active-site fit</tspan></text><path d="M 490 212 C 490 237, 805 125, 805 150" fill="none" stroke="#7184a6" stroke-width="3" marker-end="url(#arr)"/><rect x="675" y="150" width="260" height="62" rx="15" fill="#fff3dc" stroke="#536b93" stroke-width="2"/><text x="805" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17243b"><tspan x="805" dy="0">Enzyme–substrate complex</tspan></text><path d="M 805 212 C 805 237, 175 237, 175 262" fill="none" stroke="#7184a6" stroke-width="3" marker-end="url(#arr)"/><rect x="45" y="262" width="260" height="62" rx="15" fill="#e8f0ff" stroke="#536b93" stroke-width="2"/><text x="175" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17243b"><tspan x="175" dy="0">Reaction occurs</tspan></text><path d="M 175 324 C 175 349, 490 237, 490 262" fill="none" stroke="#7184a6" stroke-width="3" marker-end="url(#arr)"/><rect x="360" y="262" width="260" height="62" rx="15" fill="#e7f7f0" stroke="#536b93" stroke-width="2"/><text x="490" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17243b"><tspan x="490" dy="0">Products released; enzyme</tspan><tspan x="490" dy="22">remains</tspan></text><text x="500" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#66758b">ZEEROZ ACADEMY • CLASS IX BIOLOGY • CONCEPT DIAGRAM</text></svg>