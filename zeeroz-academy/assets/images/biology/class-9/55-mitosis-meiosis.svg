<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Mitosis vs Meiosis</title><desc id="desc">Compare the number and chromosome content of daughter cells produced by mitosis and meiosis.</desc><rect width="100%" height="100%" rx="22" fill="#fbfcff"/><text x="500" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#14243c">Mitosis vs Meiosis</text><text x="500" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#53657e">ZEEROZ ACADEMY • CLASS IX BIOLOGY</text><path d="M 272 260 H 290" stroke="#7184a6" stroke-width="4"/><path d="M 281 251 L 292 260 L 281 269" fill="none" stroke="#7184a6" stroke-width="4"/><path d="M 477 260 H 495" stroke="#7184a6" stroke-width="4"/><path d="M 486 251 L 497 260 L 486 269" fill="none" stroke="#7184a6" stroke-width="4"/><path d="M 682 260 H 700" stroke="#7184a6" stroke-width="4"/><path d="M 691 251 L 702 260 L 691 269" fill="none" stroke="#7184a6" stroke-width="4"/><rect x="95" y="205" width="175" height="112" rx="18" fill="#e8f0ff" stroke="#536b93" stroke-width="2"/><circle cx="182" cy="235" r="13" fill="#536b93"/><text x="182" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17243b">Mitosis: 2 cells</text><rect x="300" y="205" width="175" height="112" rx="18" fill="#e8f7ef" stroke="#536b93" stroke-width="2"/><circle cx="387" cy="235" r="13" fill="#536b93"/><text x="387" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17243b">Same chromosome number</text><rect x="505" y="205" width="175" height="112" rx="18" fill="#fff1dc" stroke="#536b93" stroke-width="2"/><circle cx="592" cy="235" r="13" fill="#536b93"/><text x="592" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17243b">Meiosis: 4 cells</text><rect x="710" y="20