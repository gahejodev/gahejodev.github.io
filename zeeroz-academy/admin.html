<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Console | Zeeroz Academy</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#17213b;font-family:Inter,system-ui,Arial}.top{background:#101b3d;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{width:min(1050px,92%);margin:30px auto}.notice{padding:14px;background:#fff5df;border:1px solid #f2dba5;border-radius:12px;color:#77551a;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.card{background:white;border:1px solid #e5eaf4;border-radius:16px;padding:22px}h1,h2{color:#101b3d}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #d8e0ee;border-radius:10px;font:inherit}textarea{min-height:90px}.btn{border:0;background:#3157d5;color:white;padding:11px 15px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:14px}.status{font-size:13px;color:#176c62;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><strong>ZEEROZ ACADEMY · ADMIN CONSOLE</strong><button class="btn" id="logout">Sign out</button></header><main class="wrap"><h1>Academy content manager</h1><p class="notice">This console requires a Firebase Authentication custom claim: <code>admin: true</code>. A normal student account cannot access administrator actions. Never grant this claim from browser code.</p><div class="grid"><section class="card"><h2>Publish a course</h2><form id="courseForm"><label for="courseTitle">Course title</label><input id="courseTitle" maxlength="120" required><label for="courseDescription">Description</label><textarea id="courseDescription" maxlength="1200" required></textarea><button class="btn">Publish course</button></form></section><section class="card"><h2>Post an announcement</h2><form id="announcementForm"><label for="announcementTitle">Title</label><input id="announcementTitle" maxlength="120" required><label for="announcementMessage">Message</label><textarea id="announcementMessage" maxlength="1200" required></textarea><button class="btn">Publish announcement</button></form></section></div><p class="status" id="status" role="status"></p></main><script type="module" src="./firebase-init.js"></script><script type="module" src="./admin.js"></script></body></html>
