name: Validate Academy course packages

on:
  push:
    paths:
      - "zeeroz-academy/content/courses/**"
      - "scripts/validate-course-packages.mjs"
      - ".github/workflows/validate-course-packages.yml"
  pull_request:
    paths:
      - "zeeroz-academy/content/courses/**"
      - "scripts/validate-course-packages.mjs"
      - ".github/workflows/validate-course-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate course registry and packages
        run: node scripts/validate-course-packages.mjs
